# asenagroup.ru - статический сайт, HTTP.
# Пока домен не делегирован, этот же блок отдаёт сайт по IP (default_server).
# HTTPS включается скриптом /usr/local/bin/asena-golive.sh - он перезапишет этот файл.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name asenagroup.ru www.asenagroup.ru 193.187.94.135 _;

    root /var/www/asenagroup.ru;
    index index.html;

    access_log /var/log/nginx/asenagroup.access.log;
    error_log  /var/log/nginx/asenagroup.error.log;

    # ACME http-01 (certbot --webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # статика кэшируется надолго (css/js подключены с ?v=N)
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # html не кэшируется, чтобы деплой был виден сразу
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location = /robots.txt { access_log off; log_not_found off; }
    location = /favicon.ico { access_log off; log_not_found off; }

    location ~ /\.(?!well-known) { deny all; }

    location / {
        expires -1;
        try_files $uri $uri/ $uri.html =404;
    }
}
